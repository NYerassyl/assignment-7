name: Assignment 7 PostgreSQL authentication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: assignment7
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: assignment7_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assignment7 -d assignment7_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://assignment7:ci_only@127.0.0.1:5432/assignment7_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_live.py
      - run: alembic downgrade base
      - run: alembic upgrade head
